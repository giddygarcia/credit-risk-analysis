[project]
name = "credit-risk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Giddy Garcia", email = "giddygarcia@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "imbalanced-learn>=0.14.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "python-calamine>=0.9.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
credit-risk = "credit_risk:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
